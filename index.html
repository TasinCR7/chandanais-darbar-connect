  <body>
    <div id="root">
      <style>
        .initial-loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #0a0a0a;
          color: #f1ebd9;
          font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
          margin: 0;
          overflow: hidden;
        }
        .initial-loader-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(220, 165, 35, 0.2);
          border-radius: 50%;
          border-top-color: #dca523;
          animation: spin 1s ease-in-out infinite;
          margin-bottom: 16px;
        }
        .initial-loader-text {
          font-size: 1.1rem;
          font-weight: 500;
          opacity: 0.8;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">লোড হচ্ছে...</div>
      </div>
    </div>
    <script>
      // Fail-safe timer: Show a reload option if the app takes too long to load/mount
      window.__loaderTimer = setTimeout(function() {
        if (window.__appMounted) return;
        var loaderText = document.querySelector('.initial-loader-text');
        if (loaderText && loaderText.textContent.indexOf('লোড হচ্ছে') !== -1) {
          loaderText.innerHTML = 
            'লোড হতে সাধারণের চেয়ে বেশি সময় নিচ্ছে...<br/><button onclick="window.location.reload()" style="margin-top: 16px; border: none; border-radius: 999px; padding: 10px 20px; background: #dca523; color: #0a0a0a; font-weight: 700; cursor: pointer; font-size: 0.95rem; font-family: inherit; box-shadow: 0 4px 12px rgba(220,165,35,0.25);">পেজটি রিলোড করুন</button>';
        }
      }, 12000);
    </script>
