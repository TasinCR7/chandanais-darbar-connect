<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#113322"/>
      <stop offset="100%" stop-color="#05150e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8822"/>
    </linearGradient>
    <linearGradient id="dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Golden Outer Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="10 5" opacity="0.4"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>

  <!-- Crescent and Star -->
  <path d="M 360,140 A 100 100 0 1 0 170,160 A 120 120 0 1 1 360,140 Z" fill="url(#gold)" filter="url(#glow)" opacity="0.3"/>
  <polygon points="120,100 125,115 140,115 128,125 132,140 120,130 108,140 112,125 100,115 115,115" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Main Dome -->
  <path d="M 156,380 
           C 156,280 186,220 256,180 
           C 326,220 356,280 356,380 Z" 
        fill="url(#dome)" stroke="#FFD700" stroke-width="4"/>
        
  <path d="M 256,180 L 256,120 M 236,150 L 276,150" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="110" r="10" fill="url(#gold)"/>

  <!-- Side Minarets -->
  <rect x="116" y="280" width="20" height="100" fill="#166534" stroke="#FFD700" stroke-width="3"/>
  <path d="M 116,280 L 126,240 L 136,280 Z" fill="url(#gold)"/>
  
  <rect x="376" y="280" width="20" height="100" fill="#166534" stroke="#FFD700" stroke-width="3"/>
  <path d="M 376,280 L 386,240 L 396,280 Z" fill="url(#gold)"/>

  <!-- Arch Door -->
  <path d="M 206,380 L 206,330 A 50 50 0 0 1 306,330 L 306,380 Z" fill="#0A2215" stroke="url(#gold)" stroke-width="4"/>
  <path d="M 256,360 A 20 20 0 0 1 276,380 L 236,380 A 20 20 0 0 1 256,360" fill="url(#gold)"/>

  <!-- Text -->
  <text x="256" y="450" font-family="'Tiro Bangla', sans-serif" font-size="28" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="1">চন্দনাইশ দরবার শরীফ</text>
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#A0C0B0" text-anchor="middle" letter-spacing="2">CHANDANAISH DARBAR SHARIF</text>

</svg>
